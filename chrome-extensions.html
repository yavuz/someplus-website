<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Eklentileri | someplus.work</title>
    <meta name="description" content="Chrome tarayıcınız için geliştirdiğimiz performans odaklı, kullanışlı eklentiler. Üretkenliğinizi artırın.">
    <meta name="keywords" content="chrome eklentisi, chrome extension, tab yönetimi, üretkenlik, someplus">
    <meta name="author" content="someplus.work">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://someplus.work/chrome-extensions.html">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.svg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://someplus.work/chrome-extensions.html">
    <meta property="og:title" content="Chrome Eklentileri | someplus.work">
    <meta property="og:description" content="Chrome tarayıcınız için geliştirdiğimiz performans odaklı, kullanışlı eklentiler.">
    <meta property="og:image" content="https://someplus.work/bg.png">
    <link rel="stylesheet" href="fonts/WEB/css/satoshi.css">
    <style>
        :root {
            --blue: #1B5AEB;
            --blue-50: rgba(27, 90, 235, 0.05);
            --blue-10: rgba(27, 90, 235, 0.1);
            --blue-20: rgba(27, 90, 235, 0.2);
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
        }

        [data-theme="light"] {
            --bg: #F6F7FB;
            --surface: #FFFFFF;
            --surface-alt: #F0F1F5;
            --text-1: #0C0E16;
            --text-2: #52556A;
            --text-3: #9295A6;
            --border: rgba(12, 14, 22, 0.07);
            --card-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 2px 12px rgba(0,0,0,0.03);
            --card-shadow-hover: 0 0 0 1px rgba(27,90,235,0.15), 0 12px 40px rgba(27,90,235,0.1);
        }

        [data-theme="dark"] {
            --bg: #0A0B10;
            --surface: #14151E;
            --surface-alt: #1C1D2A;
            --text-1: #EAEBF0;
            --text-2: #8B8DA0;
            --text-3: #55576A;
            --border: rgba(255, 255, 255, 0.06);
            --card-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 2px 12px rgba(0,0,0,0.2);
            --card-shadow-hover: 0 0 0 1px rgba(27,90,235,0.3), 0 12px 40px rgba(27,90,235,0.12);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Satoshi-Variable', 'Satoshi-Regular', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-1);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background 0.5s var(--ease), color 0.5s var(--ease);
        }

        .page { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }

        /* ---- NAV ---- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.75rem 0;
            opacity: 0; animation: enter 0.6s var(--ease) 0.1s forwards;
        }

        .logo { display: flex; align-items: center; text-decoration: none; }
        .logo img { height: 34px; transition: transform 0.4s var(--ease); }
        .logo:hover img { transform: scale(1.04); }
        [data-theme="dark"] .logo img { filter: brightness(0) invert(1); }

        .nav-right { display: flex; align-items: center; gap: 0.75rem; }

        .theme-btn {
            width: 40px; height: 40px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            display: grid; place-items: center;
            color: var(--text-3);
            transition: all 0.4s var(--ease);
            position: relative; overflow: hidden;
        }
        .theme-btn:hover { border-color: var(--blue-20); color: var(--blue); transform: scale(1.06); }
        .theme-btn svg { width: 18px; height: 18px; position: absolute; transition: all 0.4s var(--ease); }
        .theme-btn .sun { opacity: 0; transform: rotate(-90deg) scale(0); }
        .theme-btn .moon { opacity: 1; transform: rotate(0) scale(1); }
        [data-theme="dark"] .theme-btn .sun { opacity: 1; transform: rotate(0) scale(1); }
        [data-theme="dark"] .theme-btn .moon { opacity: 0; transform: rotate(90deg) scale(0); }

        /* ---- HEADER ---- */
        .header {
            padding: 3rem 0 2rem;
            opacity: 0; animation: enter 0.7s var(--ease) 0.15s forwards;
        }

        .header h1 {
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.1;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .chrome-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #4285F4, #34A853, #FBBC05, #EA4335);
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: white;
            box-shadow: 0 4px 20px rgba(66, 133, 244, 0.3);
        }

        .chrome-icon svg {
            width: 28px;
            height: 28px;
        }

        .header p {
            font-size: 1.05rem;
            color: var(--text-2);
            max-width: 600px;
        }

        /* ---- EXTENSIONS GRID ---- */
        .extensions {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
            padding: 2rem 0 5rem;
        }

        .extension-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 2rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: var(--card-shadow);
            transition: all 0.5s var(--ease);
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: enter 0.6s var(--ease) forwards;
        }

        .extension-card:nth-child(1) { animation-delay: 0.25s; }
        .extension-card:nth-child(2) { animation-delay: 0.32s; }
        .extension-card:nth-child(3) { animation-delay: 0.39s; }
        .extension-card:nth-child(4) { animation-delay: 0.46s; }
        .extension-card:nth-child(5) { animation-delay: 0.53s; }
        .extension-card:nth-child(6) { animation-delay: 0.60s; }

        .extension-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: radial-gradient(circle at 50% 0%, var(--blue-50), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s var(--ease);
            pointer-events: none;
        }

        .extension-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--card-shadow-hover);
        }

        .extension-card:hover::after { opacity: 1; }

        .extension-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 1.25rem;
            position: relative;
            z-index: 1;
            transition: transform 0.5s var(--ease);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .extension-card:hover .extension-icon {
            transform: scale(1.08);
        }

        .extension-name {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-1);
            position: relative;
            z-index: 1;
            transition: color 0.3s var(--ease);
        }

        .extension-card:hover .extension-name {
            color: var(--blue);
        }

        /* ---- FOOTER ---- */
        footer {
            border-top: 1px solid var(--border);
            padding: 2rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: var(--text-3);
            opacity: 0; animation: enter 0.6s var(--ease) 0.7s forwards;
        }

        footer a {
            color: var(--text-3);
            text-decoration: none;
            transition: color 0.3s var(--ease);
        }

        footer a:hover { color: var(--blue); }

        /* ---- ANIMATIONS ---- */
        @keyframes enter {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 768px) {
            .page { padding: 0 1.25rem; }
            .header { padding: 2rem 0 1.5rem; }
            .extensions { 
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 1rem;
                padding: 1.5rem 0 3rem;
            }
            footer { flex-direction: column; gap: 0.75rem; text-align: center; }
        }

        @media (max-width: 480px) {
            .extensions { 
                grid-template-columns: 1fr;
            }
            .chrome-icon {
                width: 40px;
                height: 40px;
            }
            .chrome-icon svg {
                width: 24px;
                height: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<div class="page">
    <nav>
        <a href="/" class="logo"><img src="logo.svg" alt="someplus.work"></a>
        <div class="nav-right">
            <button class="theme-btn" onclick="toggleTheme()" aria-label="Tema değiştir">
                <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </nav>

    <section class="header">
        <h1>
            <div class="chrome-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="21.17" y1="8" x2="12" y2="8"/><line x1="3.95" y1="6.06" x2="8.54" y2="14"/><line x1="10.88" y1="21.94" x2="15.46" y2="14"/></svg>
            </div>
            Chrome Eklentileri
        </h1>
        <p>Tarayıcı deneyiminizi geliştiren, üretkenliğinizi artıran Chrome eklentilerimizi keşfedin.</p>
    </section>

    <div class="extensions">
        
        <!-- Smart Tab Suspender -->
        <a href="https://chromewebstore.google.com/detail/smart-tab-suspender/mmhfonkfehekiofpkjiofjeoofloidog?authuser=0&hl=tr" target="_blank" class="extension-card">
            <img src="images/icons/smart_tab_suspender.png" alt="Smart Tab Suspender" class="extension-icon">
            <h3 class="extension-name">Smart Tab Suspender</h3>
        </a>

        <!-- TabTint -->
        <a href="https://chromewebstore.google.com/detail/tabtint/bngecoefhbooakaodjlfegpbjhlhkfif?authuser=0&hl=tr" target="_blank" class="extension-card">
            <img src="images/icons/tabtint.png" alt="TabTint" class="extension-icon">
            <h3 class="extension-name">TabTint</h3>
        </a>

        <!-- Tabio -->
        <a href="https://chromewebstore.google.com/detail/tabio/nckidmkgahoolemnaaklgcfpdmlfnofb?authuser=0&hl=tr" target="_blank" class="extension-card">
            <img src="images/icons/tabio.png" alt="Tabio" class="extension-icon">
            <h3 class="extension-name">Tabio</h3>
        </a>

        <!-- Donefetti -->
        <a href="https://chromewebstore.google.com/detail/donefetti/pdckdimjeaaomlgdnhppaogacipeigod?authuser=0&hl=tr" target="_blank" class="extension-card">
            <img src="images/icons/donefetti.png" alt="Donefetti" class="extension-icon">
            <h3 class="extension-name">Donefetti</h3>
        </a>

        <!-- SideKick WA -->
        <a href="https://chromewebstore.google.com/detail/sidekick-wa/ijfnpjcikndpffampjljggnnobagahkf?authuser=0&hl=tr" target="_blank" class="extension-card">
            <img src="images/icons/sidekick_whatsapp.png" alt="SideKick WA" class="extension-icon">
            <h3 class="extension-name">SideKick WA</h3>
        </a>

        <!-- ChromaShift -->
        <a href="https://chromewebstore.google.com/detail/chromashift/ifngfcdoccfbgagjiahnbkajaikjaiek?authuser=0&hl=tr" target="_blank" class="extension-card">
            <img src="images/icons/chroma_shift.png" alt="ChromaShift" class="extension-icon">
            <h3 class="extension-name">ChromaShift</h3>
        </a>

    </div>

    <footer>
        <span>&copy; 2026 someplus.work</span>
        <span>Tüm hakları saklıdır.</span>
    </footer>
</div>

<script>
    function toggleTheme() {
        const html = document.documentElement;
        const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    }
    (function() {
        const s = localStorage.getItem('theme');
        if (s) document.documentElement.setAttribute('data-theme', s);
        else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
            document.documentElement.setAttribute('data-theme', 'dark');
    })();
</script>

</body>
</html>
